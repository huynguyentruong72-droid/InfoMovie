<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Movie Discovery App</title>

<style>
:root {
  --bg: #f4f4f4;
  --card: #fff;
  --text: #000;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #fff;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: var(--card);
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr;
}

aside {
  padding: 20px;
  background: var(--card);
}

main {
  padding: 20px;
}

input[type="text"] {
  width: 100%;
  padding: 8px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin: 8px 0;
}

.movies {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
  gap: 20px;
}

.movie {
  background: var(--card);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 8px rgba(0,0,0,.15);
  transition: transform .3s;
}

.movie:hover {
  transform: scale(1.05);
}

.movie img {
  width: 100%;
  height: 280px;
  object-fit: cover;
}

.movie-info {
  padding: 10px;
}

.toggle {
  cursor: pointer;
}

/* ===== MODAL BÀI 30 ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: var(--card);
  padding: 15px;
  max-width: 90%;
  max-height: 90%;
  border-radius: 8px;
}

.modal-content img {
  max-width: 100%;
  max-height: 80vh;
  display: block;
}

.close {
  text-align: right;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h2>🎬 Movie Discovery App</h2>
  <label class="toggle">
    <input type="checkbox" id="modeToggle"> 🌙
  </label>
</header>

<div class="container">
  <aside>
    <h3>Bộ lọc</h3>
    <input type="text" id="search" placeholder="🔍 Tìm kiếm phim...">

    <h4>Thể loại</h4>
    <div id="genres"></div>

    <hr>
    <!-- LINK BÀI 30 -->
    <a href="#" onclick="openBai30()">📎 Bài tập 30</a>
  </aside>

  <main>
    <div class="movies" id="movieList"></div>
  </main>
</div>

<!-- MODAL BÀI 30 -->
<div class="modal" id="bai30Modal">
  <div class="modal-content">
    <div class="close" onclick="closeBai30()">✖</div>
    <img src="anh/bai30.png" alt="Bài tập 30">
  </div>
</div>

<script>
const movies = [
  {title:"Inception", year:2010, genre:"Hành động", img:"anh/inception.jpg"},
  {title:"Avatar", year:2009, genre:"Phiêu lưu", img:"anh/avatar.jpg"},
  {title:"Titanic", year:1997, genre:"Lãng mạn", img:"anh/titanic.jpg"},
  {title:"The Matrix", year:1999, genre:"Khoa học viễn tưởng", img:"anh/matrix.jpg"}
];

const movieList = document.getElementById("movieList");
const genresDiv = document.getElementById("genres");
const searchInput = document.getElementById("search");

let selectedGenres = [];

function renderGenres() {
  genresDiv.innerHTML = "";
  [...new Set(movies.map(m => m.genre))].forEach(g => {
    const lb = document.createElement("label");
    lb.innerHTML = `<input type="checkbox" value="${g}"> ${g}`;
    lb.querySelector("input").onchange = filterMovies;
    genresDiv.appendChild(lb);
  });
}

function renderMovies(list) {
  movieList.innerHTML = "";
  list.forEach(m => {
    movieList.innerHTML += `
      <div class="movie">
        <img src="${m.img}">
        <div class="movie-info">
          <strong>${m.title}</strong>
          <div>${m.year}</div>
        </div>
      </div>`;
  });
}

function filterMovies() {
  selectedGenres = [...document.querySelectorAll("#genres input:checked")].map(c => c.value);
  let result = movies.filter(m =>
    (selectedGenres.length === 0 || selectedGenres.includes(m.genre)) &&
    m.title.toLowerCase().includes(searchInput.value.toLowerCase())
  );
  renderMovies(result);
}

searchInput.oninput = filterMovies;

// Dark mode
document.getElementById("modeToggle").onchange = e => {
  document.body.classList.toggle("dark", e.target.checked);
};

// BÀI 30
function openBai30() {
  document.getElementById("bai30Modal").style.display = "flex";
}
function closeBai30() {
  document.getElementById("bai30Modal").style.display = "none";
}

renderGenres();
renderMovies(movies);
</script>

</body>
</html>
